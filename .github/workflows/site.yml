name: Site

on:
  pull_request:
    paths-ignore:
      - '**/README.md'
      - 'LICENSE'
  push:
    branches: [master]
    paths-ignore:
      - '**/README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUCKET: www.alexanderbaro.com
  DISTRIBUTION_ID: EDDWWKADONCMF
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-deploy-personal-website
  SITE_URL: https://www.alexanderbaro.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Size budget and local references
        run: python3 scripts/check_site.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install check tooling
        run: npm ci

      - name: Validate HTML
        run: npx html-validate "site/**/*.html"

  deploy:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Each pass uploads one group of files with its own Cache-Control header.
      # The first pass also removes files that are no longer in site/.
      - name: Upload images, fonts and icons (cache 7 days)
        run: |
          aws s3 sync site/ "s3://$BUCKET/" --delete \
            --exclude "*.html" --exclude "*.css" --exclude "*.js" --exclude "*.pdf" \
            --cache-control "public, max-age=604800"

      - name: Upload CSS, JS and PDFs (cache 1 hour)
        run: |
          aws s3 sync site/ "s3://$BUCKET/" \
            --exclude "*" --include "*.css" --include "*.js" --include "*.pdf" \
            --cache-control "public, max-age=3600"

      - name: Upload HTML (always revalidate)
        run: |
          aws s3 sync site/ "s3://$BUCKET/" \
            --exclude "*" --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text)
          echo "Invalidation $id"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: Smoke test
        run: |
          fail=0
          expect() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$1")
            if [ "$code" = "$2" ]; then echo "ok   $1 -> $code"; else echo "FAIL $1 -> $code (expected $2)"; fail=1; fi
          }
          expect / 200
          expect /styles.css 200
          expect /main.js 200
          expect /assets/portrait.webp 200
          expect /AVBaro_Resume.pdf 200
          expect /this-page-does-not-exist 404

          # The deploy step above gives HTML, CSS/JS, and images/fonts each a
          # different Cache-Control lifetime via separate S3 syncs. Confirm
          # that actually landed, so a reordered sync step or a tweaked
          # --exclude pattern fails loudly here instead of silently serving
          # stale HTML to visitors later.
          expect_cache_control() {
            header=$(curl -s -D - -o /dev/null "$SITE_URL$1" | tr -d '\r' | grep -i '^cache-control:' | cut -d' ' -f2-)
            if [ "$header" = "$2" ]; then
              echo "ok   $1 cache-control -> $header"
            else
              echo "FAIL $1 cache-control -> '$header' (expected '$2')"
              fail=1
            fi
          }
          expect_cache_control / "public, max-age=0, must-revalidate"
          expect_cache_control /styles.css "public, max-age=3600"
          expect_cache_control /assets/portrait.webp "public, max-age=604800"

          exit $fail
